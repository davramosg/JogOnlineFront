spring.application.name=serviciousuario

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/serviciousuario
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Driver y Dialecto
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Gestión de tablas (Muy importante durante el desarrollo)
# 'update' creará las tablas automáticamente basándose en tu clase @Entity Usuario
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola para debugear
spring.jpa.show-sql=true
